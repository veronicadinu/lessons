
  @if(respons.length > 0 ){
  <div class="subjects-wrapper">

  <!-- Header with title and Add button -->
  <div class="subjects-header">
    <h3>Subjects</h3>
    <p-button label="Add" icon="pi pi-plus" iconPos="right" [routerLink]="['/addSubject']"></p-button>
  </div>

 <div class="search-bar-wrapper">
  <div class="search-bar-inside">
    <input
      type="text"
      pInputText
      [(ngModel)]="search"
      placeholder="Search subjects..."
      autocomplete="off"
    />
    <i class="pi pi-search"></i>
  </div>
</div>



  <!-- Responsive subject grid -->
  <div class="subjects-grid">
    @for(r of filteredSubjects; track r.id; let i=$index){
      <div class="subject-card">
        <div class="subject-info">
          <a [routerLink]="['/subject/', r.id]" class="subject-link">
            {{ r.nameSubject }}
          </a>
          <p-button icon="pi pi-times" [text]="true" severity="danger" (click)="deleteSubject(r.id)"></p-button>
        </div>
      </div>
    }
  </div>

</div>
} @else{

  

  <div class="hero-container">
  <div class="hero-content">
    <h1>📘 Subjects</h1>
    <p>Manage your subjects with ease and clarity.</p>


      <p-button 
      [routerLink]="['/addSubject']"
      icon="pi pi-plus"
      iconPos="right"
      label="Add Subject"
      class="cta-button p-button-rounded p-button-lg">
    </p-button>
  </div>
</div>



}
