<p-toolbar>
    <ng-template #start>
        <p-button [routerLink]="['/']" icon="pi pi-home" class="mr-2" text severity="secondary" />
        <p-button icon="pi pi-print" class="mr-2" text severity="secondary" />
        <p-button icon="pi pi-upload" text severity="secondary" />
        <p-button [routerLink]="['/subjects']" icon="pi pi-plus" text severity="secondary" />
        
    </ng-template>
 
    <ng-template #end> 
        @if (user){
          <button (click)="logout()"> Logout </button>
        }  

        @if(!user){
            <button (click)="login()"> Login </button>
        }
      <p-chip [label]="user?.name || 'User'" alt="Avatar image">
        <img style="border-radius: 50%;" width="32" height="32" [src]="user?.picture ? user?.picture : '/assets/default-avatar.webp'" referrerpolicy="no-referrer" />
      </p-chip>

    </ng-template>

</p-toolbar>
