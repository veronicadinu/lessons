



<form [formGroup]="form" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; gap: 1rem;">

    <h3>Add your Preferred Subject!!!</h3>

    @if(!loading){

        <ng-container  >

<p-floatlabel variant="on">
    <input pTextarea id="on_label" formControlName="nameSubject" autocomplete="off"/>
    <label for="on_label">Name Subject</label>
</p-floatlabel>


<p-floatlabel variant="on">
    <p-select inputId="on_label" [options]="languageOptions" formControlName="language"  optionLabel="name" styleClass="w-full" />
    <label for="on_label">Language</label>
</p-floatlabel>




<p-fileupload (onRemove)="onRemove($event)" [showCancelButton]="false" [showUploadButton]="false" (onSelect)="onUpload($event)"  [multiple]="true" accept="application/pdf" mode="advanced">
    <ng-template #empty>
        <div>Drag and drop files to here to upload.</div>
    </ng-template>
</p-fileupload>
<p-toast></p-toast>


<p-floatlabel variant="on">
    <textarea pTextarea formControlName="instructionAi" rows="3" cols="30" style="resize: none" class="h-full"></textarea>
    <label for="on_label">Add Prompt</label>
</p-floatlabel>

<p-floatlabel variant="on">
    <p-datepicker  selectionMode="range" formControlName="date" [readonlyInput]="true"   autocomplete="off" />
    <label for="on_label">Start Date-End Date</label>
</p-floatlabel>

<p-floatlabel variant="on">
    <p-datepicker  formControlName="timePerDay" [timeOnly]="true"  autocomplete="off" />
    <label for="on_label">Minutes and Hours per day</label>
</p-floatlabel>

<p-floatlabel variant="on">
    <p-datepicker  formControlName="maxLengthLesson"  [timeOnly]="true"  autocomplete="off" />
    <label for="on_label">Max Lenght for 1 lesson</label>
</p-floatlabel>

<p>Do you what notifications?</p>
 <p-togglebutton  formControlName="activatedPush"  [onIcon]="'pi pi-check'" [offIcon]="'pi pi-times'" class="ng-invalid ng-dirty" styleClass="w-full sm:w-40" aria-label="Confirmation" />

 <p-floatlabel variant="on">
    <p-datepicker  formControlName="notificationTime"  [timeOnly]="true"  autocomplete="off" />
    <label for="on_label">Time notficated</label>
</p-floatlabel>


</ng-container>


} @else {
<p-progress-spinner ariaLabel="loading" />
}


<p-button label="Submit" [disabled]="form.invalid || loading" type="Submit" />



</form>
